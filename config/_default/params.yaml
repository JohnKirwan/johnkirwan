hugoblox:
  schema: "2.0"
  identity:
    name: Dr. John D. Kirwan
    type: person
    tagline: Bioinformatics Scientist
    description: ""
  theme:
    mode: system
    pack: matcha
    colors:
      primary: ""
      secondary: ""
      neutral: ""
    # Matcha primary (lime-600) fails WCAG AA on its light background; lime-700 passes.
    colors_light:
      primary: "#4d7c0f"
  typography:
    font: sans
    size: md
  layout:
    radius: md
    spacing: comfortable
    avatar_shape: circle
  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true
  footer:
    style: minimal
    language_switcher: true
  copyright:
    notice: © {year} {name}
  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: true
  search:
    enable: true
