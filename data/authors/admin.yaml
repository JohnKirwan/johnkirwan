experience:
  - position: Bioinformatics Scientist
    company_name: Arquimea Research Centre
    company_url: https://www.arquimea.com/research-development-innovation/research-center/
    location: La Laguna, Spain
    date_start: 2022-07-04
    date_end: 2026-03-11
    summary: |-
      Worked at the interface of the AI and biotech teams on structure-based drug discovery,
      generative molecular design, and applied machine learning — the link between the
      computational tools and the biology.

      - Contributing author on a NeurIPS 2025 paper on uncertainty quantification for deep regression: ran the empirical validation and fine-tuned/retrained models in PyTorch
      - Built a modular synthetic-data-generation pipeline orchestrating GNINA, DiffDock and AlphaFold 2, including dataset sourcing and inter-tool format conversion
      - Predicted protein structures and binding affinities for protein complexes, including metal-ion and ATP cofactors, using Boltz, AlphaFold, Foldseek and BioEMU
      - Developed the binding-affinity objective for Uncharted, an internal venture building a multi-objective small-molecule optimisation engine
      - Analysed metagenomic data, prototyped a novel operon-design approach, and ran statistical power analyses for preclinical study design
      - Ran GPU workloads on an NVIDIA DGX cluster and AWS; Docker, Git and Azure DevOps within an Agile/Scrum team
  - position: Postdoctoral Researcher
    company_name: Stazione Zoologica Anton Dohrn
    company_url: http://www.szn.it
    location: Naples, Italy
    date_start: 2019-10-01
    date_end: 2022-07-22
    summary: |-
      Quantitative sensory biology within an international Human Frontier Science Program (HFSP)
      collaboration, with emphasis on statistical modelling and signal processing of behavioural data.

      - Analysed experimental data using Bayesian multilevel regression models in R and Stan
      - Designed and executed behavioural experiments with automated data acquisition pipelines
      - Contributed to interdisciplinary publications spanning biology, optics, and computation
  - position: Project Manager (contract)
    company_name: Lund University
    company_url: http://www.lu.se
    location: Lund, Sweden
    date_start: 2019-06-01
    date_end: 2019-08-31
    summary: >-
      Short-term research management contract supervising experimental data
      collection and a masters student, bridging doctoral and postdoctoral positions.
  - position: Doctoral Researcher
    company_name: Lund University
    company_url: http://www.lu.se
    location: Lund, Sweden
    date_start: 2013-05-15
    date_end: 2018-06-07
    summary: |-
      Computational and statistical analysis of visual systems in invertebrates,
      combining experimental biology with quantitative modelling.

      - Built statistical models using Bayesian multilevel regression in R and Stan; additional analysis in Python and Matlab
      - Developed optical and geometric models to estimate spatial resolution theoretically
      - Designed novel experimental protocols for quantifying animal visual performance

