bio: |-
  Computational biologist and data scientist with a track record of applying machine
  learning and statistical modelling to complex biological problems — from biomolecular
  structure prediction and de novo peptide design to metagenomic analysis and preclinical
  trial design.

  My background combines rigorous quantitative training (Bayesian modelling, deep learning,
  MLOps) with hands-on experience across the full data pipeline — from experimental design
  through to deployment and reproducible reporting. I have worked at the interface of Biotech
  and AI in an industry research setting, contributing to work that reached commercial spinout
  stage and to a NeurIPS 2025 publication on uncertainty quantification in deep regression.

  I am now focusing on structure-informed metagenomics, functional annotation, and
  antimicrobial-resistance research — applying the same analytical rigour to questions where
  structural and evolutionary insight meets large-scale biological data, with an eye to
  applications across health, agriculture, and the environment.

