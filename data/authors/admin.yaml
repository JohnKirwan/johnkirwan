summary: >-
  Computational biologist and data scientist pairing rigorous statistical modelling
  — Bayesian inference and deep learning — with hands-on ML engineering and
  reproducible pipelines. Nearly four years at the interface of biotech and AI
  in an industry research setting, spanning biomolecular structure prediction,
  generative molecular design, and metagenomic analysis, and including a
  contribution to a NeurIPS 2025 publication on uncertainty quantification.

