backend:
  name: git-gateway
  branch: main
  squash_merges: true
media_folder: static/uploads
public_folder: /uploads
collections:
  - name: site
    label: Site Content
    files:
      - name: profile
        label: Profile
        file: data/authors/admin.yaml
        fields:
          - {label: Display Name, name: title, widget: string}
          - label: Name
            name: name
            widget: object
            fields:
              - {label: Display, name: display, widget: string}
              - {label: Given, name: given, widget: string, required: false}
              - {label: Family, name: family, widget: string, required: false}
          - {label: Role, name: role, widget: string}
          - {label: Headline, name: headline, widget: string, required: false}
          - {label: Summary, name: summary, widget: text}
          - label: Contact
            name: contact
            widget: object
            fields:
              - {label: Email, name: email, widget: string}
              - {label: Phone, name: phone, widget: string, required: false}
              - {label: Website, name: website, widget: string, required: false}
              - {label: Location, name: location, widget: string, required: false}
          - label: Photo
            name: photo
            widget: object
            fields:
              - {label: Path, name: path, widget: string}
              - {label: Alt, name: alt, widget: string, required: false}
              - {label: Width PX, name: width_px, widget: number, value_type: int, required: false}
              - {label: Width MM, name: width_mm, widget: number, value_type: int, required: false}
              - {label: Include In Markdown, name: include_in_markdown, widget: boolean, required: false, default: true}
              - {label: Include In PDF, name: include_in_pdf, widget: boolean, required: false, default: true}
          - {label: Superuser, name: superuser, widget: boolean, required: false, default: true}
          - label: Organizations
            name: organizations
            widget: list
            required: false
            fields:
              - {label: Name, name: name, widget: string}
              - {label: URL, name: url, widget: string, required: false}
          - label: Links
            name: links
            widget: list
            required: false
            fields:
              - {label: Label, name: label, widget: string}
              - {label: Icon, name: icon, widget: string}
              - {label: URL, name: url, widget: string}
              - {label: Username, name: username, widget: string, required: false}
              - {label: Include In PDF, name: include_in_pdf, widget: boolean, required: false, default: true}
          - {label: Interests, name: interests, widget: list, required: false}
          - label: Education
            name: education
            widget: list
            required: false
            fields:
              - {label: Degree, name: degree, widget: string}
              - {label: Area, name: area, widget: string}
              - {label: Institution, name: institution, widget: string}
              - {label: Location, name: location, widget: string, required: false}
              - {label: Start Date, name: date_start, widget: string, required: false}
              - {label: End Date, name: date_end, widget: string, required: false}
              - {label: Summary, name: summary, widget: markdown, required: false}
              - label: Button
                name: button
                widget: object
                required: false
                fields:
                  - {label: Text, name: text, widget: string, required: false}
                  - {label: URL, name: url, widget: string, required: false}
          - label: Experience
            name: experience
            widget: list
            required: false
            fields:
              - {label: Position, name: position, widget: string}
              - {label: Company Name, name: company_name, widget: string}
              - {label: Company URL, name: company_url, widget: string, required: false}
              - {label: Location, name: location, widget: string, required: false}
              - {label: Start Date, name: date_start, widget: string, required: false}
              - {label: End Date, name: date_end, widget: string, required: false}
              - {label: Summary, name: summary, widget: markdown, required: false}
          - label: Skills
            name: skills
            widget: list
            required: false
            fields:
              - {label: Name, name: name, widget: string}
              - {label: Include In PDF, name: include_in_pdf, widget: boolean, required: false, default: true}
              - {label: Color, name: color, widget: string, required: false}
              - {label: Border Color, name: color_border, widget: string, required: false}
              - label: Items
                name: items
                widget: list
                required: false
                fields:
                  - {label: Name, name: name, widget: string}
                  - {label: Description, name: description, widget: string, required: false}
                  - {label: Percent, name: percent, widget: number, value_type: int, required: false}
                  - {label: Icon, name: icon, widget: string, required: false}
          - label: Languages
            name: languages
            widget: list
            required: false
            fields:
              - {label: Name, name: name, widget: string}
              - {label: Level, name: level, widget: string, required: false}
              - {label: Percent, name: percent, widget: number, value_type: int, required: false}
          - label: Awards
            name: awards
            widget: list
            required: false
            fields:
              - {label: Title, name: title, widget: string}
              - {label: Awarder, name: awarder, widget: string}
              - {label: Icon, name: icon, widget: string, required: false}
              - {label: URL, name: url, widget: string, required: false}
              - {label: Certificate URL, name: certificate_url, widget: string, required: false}
              - {label: Date, name: date, widget: string, required: false}
              - {label: Summary, name: summary, widget: markdown, required: false}
          - {label: Bio, name: bio, widget: markdown, required: false}
          - label: Resume PDF
            name: resume_pdf
            widget: object
            required: false
            fields:
              - {label: Output, name: output, widget: string, required: false}
              - {label: Include Awards, name: include_awards, widget: boolean, required: false, default: true}
              - {label: Skill Group Names, name: skill_group_names, widget: list, required: false}
              - label: Page One
                name: page_one
                widget: object
                required: false
                fields:
                  - {label: Key Highlights, name: key_highlights, widget: list, required: false}
                  - {label: Featured Skill Names, name: featured_skill_names, widget: list, required: false}
                  - {label: Featured Experience Positions, name: featured_experience_positions, widget: list, required: false}
                  - {label: Featured Education Degrees, name: featured_education_degrees, widget: list, required: false}
      - name: teaching
        label: Teaching
        file: content/teaching/_index.md
        fields:
          - {label: Title, name: title, widget: string}
          - {label: Summary, name: summary, widget: string, required: false}
          - {label: Show Profile, name: profile, widget: boolean, required: false, default: true}
          - {label: Show Reading Time, name: reading_time, widget: boolean, required: false, default: false}
          - {label: Show Share Links, name: share, widget: boolean, required: false, default: false}
          - {label: Show Comments, name: comments, widget: boolean, required: false, default: false}
          - label: Header
            name: header
            widget: object
            required: false
            fields:
              - {label: Caption, name: caption, widget: string, required: false}
              - {label: Image, name: image, widget: string, required: false}
          - {label: Body, name: body, widget: markdown, required: false}
